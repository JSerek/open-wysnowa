# EQD-AI v2 Configuration — Evidence Extraction (L0 + L1)
# API keys are NEVER stored here — use .env file.
# v1-only blocks (synthesizer/category/analyst agents, theme_refinement,
# analyst_guidelines, L2 thresholds) were removed in the v2 pivot — recover from
# the v1-full-pipeline git tag if needed.

# ── PROVIDERS ─────────────────────────────────────────────────────
providers:
  openai:
    type: openai_compatible
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1

  google:
    type: openai_compatible
    api_key_env: GOOGLE_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    instructor_mode: json  # Required: Gemini fails with tool-call mode for List fields

  openrouter:
    type: openai_compatible
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    instructor_mode: json  # Safest cross-model mode: embeds JSON in system prompt
                           # rather than relying on tool-call support (varies by model)

  ollama:
    type: openai_compatible
    api_key_env: OLLAMA_API_KEY
    base_url: http://localhost:11434/v1
    instructor_mode: json  # local models: embed JSON schema in prompt (like openrouter)

# ── NAMED MODELS ──────────────────────────────────────────────────
models:
  embed_openai:
    provider: openai
    model_id: text-embedding-3-small

  # Google direct (swap option for coder/comparator)
  gemini_flash_lite:
    provider: google
    model_id: gemini-2.5-flash-lite  # non-thinking, fast, cheaper
  gemini_flash_3_preview:
    provider: google
    model_id: gemini-3-flash-preview

  # OpenRouter (active)
  or_fast:
    provider: openrouter
    model_id: openai/gpt-5-nano
    reasoning: true               # gpt-5-nano is a reasoning model (uses reasoning tokens)
    reasoning_style: openai       # → extra_body: {"reasoning_effort": "low"|...}
  or_smart:
    provider: openrouter
    model_id: google/gemini-3-flash-preview
    reasoning: true               # Gemini Flash has baked-in thinking; controlled via OpenRouter
    reasoning_style: openai       # OpenRouter normalises to openai-style extra_body params

  # Ollama (local, sequential — see docs/testing/local_models_leaderboard_feasibility.md)
  # reasoning: false keeps the agent's reasoning_effort translation out of the request.
  # extra_body {reasoning_effort: none} disables Ollama thinking (default is ON for
  # qwen/gemma — thinking ate the token budget and broke IC refinement in the qwen smoke).
  ollama_qwen:
    provider: ollama
    model_id: qwen3.6:35b-a3b
    reasoning: false
    extra_body: {reasoning_effort: none}
  ollama_qwen38:
    provider: ollama
    model_id: qwen3.8:27b
    reasoning: false
    extra_body: {reasoning_effort: none}
  ollama_gemma:
    provider: ollama
    model_id: gemma4:26b-a4b-it-q8_0
    reasoning: false
    extra_body: {reasoning_effort: none}
  ollama_gptoss:                  # phase 2 (third model)
    provider: ollama
    model_id: gpt-oss:20b
    reasoning: false

# ── AGENTS ────────────────────────────────────────────────────────
# v2 uses only the extraction agents + embeddings.
# Embeddings always stay on OpenAI (OpenRouter has no embedding API).
agents:
  coder_agent:
    model: or_smart        # google/gemini-3-flash-preview (reasoning model)
    temperature: 0.2
    max_tokens: 16000
    reasoning_effort: low  # mechanical extraction task — low effort saves tokens

  codebook_comparator:
    model: or_smart        # google/gemini-3-flash-preview (reasoning model)
    temperature: 0.1
    max_tokens: 8000
    reasoning_effort: low  # merge/new decision — mechanical, low effort appropriate

  embedding:
    model: embed_openai    # stays on OpenAI — OpenRouter has no embedding API

# ── STUDY ─────────────────────────────────────────────────────────
study:
  name: dying_light_beast_test
  embedding_model_locked: false

# ── PROCESSING ────────────────────────────────────────────────────
processing:
  batch_size: 10
  segments_per_coder_call: 1    # v2: 1 review = 1 LLM call (batch mode removed in Phase 1)
  its_saturation_threshold: 0.02
  its_consecutive_batches: 3
  similarity_prefilter_k: 5      # top-k shortlist size for the judge (ranking only — no thresholds)
  reasoning_log_mode: full   # "full" = log every call | "failures_only" = only failed calls
  # v2 raw-measurement pivot (Phase 1): no operating thresholds and no meta-IC
  # filter. The embedding ranks; the LLM judge decides every candidate. Removed:
  # auto_new_threshold, auto_merge_threshold, merge_conflict_similarity_threshold,
  # meta_ic_filter.
