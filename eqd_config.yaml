# EQD-AI Configuration
# API keys are NEVER stored here — use .env file

# ── PROVIDERS ─────────────────────────────────────────────────────
providers:
  openai:
    type: openai_compatible
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1

  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY

  # Anthropic via OpenAI-compatible endpoint (for embeddings workaround)
  anthropic_oai:
    type: openai_compatible
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com/v1/

  ollama:
    type: openai_compatible
    api_key_env: OLLAMA_API_KEY
    base_url: http://localhost:11434/v1

  lmstudio:
    type: openai_compatible
    api_key_env: LMSTUDIO_API_KEY
    base_url: http://localhost:1234/v1

  google:
    type: openai_compatible
    api_key_env: GOOGLE_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    instructor_mode: json  # Required: Gemini fails with tool-call mode for List fields

  openrouter:
    type: openai_compatible
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    instructor_mode: json  # Safest cross-model mode: embeds JSON in system prompt
                           # rather than relying on tool-call support (varies by model)

# ── NAMED MODELS ──────────────────────────────────────────────────
models:
  gpt4o_mini:
    provider: openai
    model_id: gpt-4o-mini

  claude_haiku:
    provider: anthropic
    model_id: claude-haiku-4-5-20251001

  claude_sonnet:
    provider: anthropic
    model_id: claude-sonnet-4-5-20250929

  llama_local:
    provider: ollama
    model_id: llama3.1:70b

  gemini_flash:
    provider: google
    model_id: gemini-2.5-flash

  gemini_flash_3_preview:
    provider: google
    model_id: gemini-3-flash-preview

  gemini_flash_lite:
    provider: google
    model_id: gemini-2.5-flash-lite  # non-thinking, fast, cheaper

  gemini_pro:
    provider: google
    model_id: gemini-2.5-pro-preview-05-06

  embed_openai:
    provider: openai
    model_id: text-embedding-3-small

  # ── OpenRouter models ─────────────────────────────────────────────
  # NOTE: verify exact model IDs at https://openrouter.ai/models
  # The IDs below are placeholders — update with exact strings before use.
  or_fast:
    provider: openrouter
    model_id: openai/gpt-5-nano

  or_smart:
    provider: openrouter
    model_id: google/gemini-3-flash-preview

# ── AGENTS ────────────────────────────────────────────────────────
# Active config: uncomment one block, comment the others.
# Embeddings always stay on OpenAI (OpenRouter has no embedding API).

# ── CURRENT: Google direct ──────────────────────────────────────
agents:
  coder_agent:
    model: gemini_flash_lite      # non-thinking Gemini; uses JSON mode (see google provider)
    temperature: 0.2
    max_tokens: 4000

  codebook_comparator:
    model: gemini_flash_lite
    temperature: 0.1
    max_tokens: 2000

  synthesizer_agent:
    model: claude_sonnet
    temperature: 0.2
    max_tokens: 16000  # extended output beta required for Claude (sent automatically)

  category_agent:
    model: claude_sonnet
    temperature: 0.2
    max_tokens: 16000  # extended output beta required for Claude (sent automatically)

  analyst_agent:
    model: claude_sonnet
    temperature: 0.3
    max_tokens: 16000

  embedding:
    model: embed_openai

# ── OPENROUTER config (swap to activate) ────────────────────────
# To switch: comment the block above, uncomment this block.
# Update or_fast / or_smart model_ids above after verifying on openrouter.ai/models
